<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta Downloader - Fast & Free</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;max-width:420px;width:100%;border-radius:20px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center}
h1{font-size:26px;margin-bottom:5px}
p{color:#666; font-size:14px; margin-bottom:15px}
input{width:100%;padding:13px;border-radius:10px;border:1.5px solid #ddd;margin-bottom:12px;font-size:15px}
button{width:100%;padding:13px;border-radius:10px;border:none;background:#e1306c;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
#result{margin-top:15px}
.btn{display:block;padding:12px;border-radius:10px;text-decoration:none;color:#fff;font-weight:bold;margin-top:10px;text-align:center}
.btn1{background:#0095f6}
.btn2{background:#28a745}
</style>
</head>
<body>
<div class="card">
<h1>Insta Downloader</h1>
<p>Paste Instagram Link Here</p>
<input type="text" id="urlInput" placeholder="https://www.instagram.com/reel/...">
<button onclick="download()">Download Now</button>
<div id="result"></div>
</div>
<script>
function download(){
let url=document.getElementById('urlInput').value.trim();
let result=document.getElementById('result');
if(!url){alert('Pehle link dalo!');return;}
if(!url.includes('instagram.com')){alert('Ye Instagram ka link nahi hai');return;}

let ddUrl = url.replace('www.instagram.com','ddinstagram.com').replace('instagram.com','ddinstagram.com');

result.innerHTML=`
<p style="color:green">✅ Link Verified</p>
<a class="btn btn1" href="${ddUrl}" target="_blank">Open & Download - Server 1</a>
<a class="btn btn2" href="https://saveinsta.app/en?url=${encodeURIComponent(url)}" target="_blank">Backup Download - Server 2</a>
<p style="margin-top:10px">Button pe click karo, video khulega fir 3 dot pe click karke download karo</p>
`;
}
</script>
</body>
</html>
