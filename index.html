<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insta Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; text-align: center; }
    h2 { color: #1c2b46; font-size: 22px; margin-bottom: 8px; }
    p.sub { color: #65676b; font-size: 13px; margin-bottom: 20px; }
    input { width: 100%; padding: 14px; border: 1.5px solid #e4e6eb; border-radius: 10px; font-size: 14px; outline: none; margin-bottom: 12px; }
    input:focus { border-color: #0084ff; }
    button { width: 100%; padding: 14px; background: #0084ff; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0073e6; }
    #result { margin-top: 18px; }
    .error { color: #ef4444; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📥 Insta Downloader</h2>
    <p class="sub">Reels & Videos Downloader - Fast & Easy</p>
    
    <input type="text" id="instaUrl" placeholder="Paste Instagram Link Here...">
    <button onclick="getDownloadLink()">Download Video</button>
    
    <div id="result"></div>
  </div>

  <script>
    function getDownloadLink() {
      let url = document.getElementById("instaUrl").value.trim();
      let res = document.getElementById("result");

      if (!url) {
        res.innerHTML = '<p class="error">⚠️ Pehle link paste karein!</p>';
        return;
      }

      res.innerHTML = `
        <p style="font-size:13px; color:#10b981; margin-bottom:10px; font-weight:bold;">✅ Video Ready!</p>
        <a href="https://cobalt.tools/" target="_blank" style="display:block; padding:12px; background:#10b981; color:#fff; text-decoration:none; border-radius:8px; font-weight:bold; margin-bottom:10px;">
          🚀 Open Downloader Server
        </a>
        <p style="font-size:11px; color:#888;">Naye tab me link paste karke 1-click me video save karein.</p>
      `;
    }
  </script>

</body>
</html>
