<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta Downloader - Fast & Free</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;max-width:420px;width:100%;border-radius:20px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center}
h1{font-size:26px;margin-bottom:5px}
p{color:#666;margin-bottom:20px}
input{width:100%;padding:14px;border:2px solid #eee;border-radius:12px;outline:none;font-size:15px}
input:focus{border-color:#d62976}
button{width:100%;margin-top:15px;padding:14px;background:linear-gradient(90deg,#feda75,#d62976);border:none;border-radius:12px;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.result{margin-top:20px;display:none}
.result a{display:block;margin-top:10px;padding:12px;background:#000;color:#fff;border-radius:10px;text-decoration:none}
small{display:block;margin-top:15px;color:#999}
</style>
</head>
<body>
<div class="card">
<h1>Instagram Downloader</h1>
<p>Paste Insta Reel / Video Link</p>
<input id="link" placeholder="https://www.instagram.com/reel/...">
<button onclick="download()">Download Now</button>
<div class="result" id="result"></div>
<small>Made with ❤️ by Bishal</small>
</div>
<script>
function download(){
 let url=document.getElementById('link').value.trim();
 if(!url){alert('Link paste karo bhai!');return;}
 if(!url.includes('instagram.com')){alert('Sahi Instagram link dalo');return;}
 let result=document.getElementById('result');
 result.style.display='block';
 result.innerHTML=`<p>Fetching...</p>`;
 // Using free API endpoint trick
 let apiUrl=`https://api.instagram.com/oembed?url=${encodeURIComponent(url)}`;
 fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`).then(r=>r.json()).then(d=>{
   result.innerHTML=`<p style="color:green">✅ Link Verified: ${d.title?d.title.substring(0,40):'Instagram Video'}</p>
   <a href="https://snapinsta.app/download?url=${encodeURIComponent(url)}" target="_blank">Open Fast Downloader 1</a>
   <a href="https://igram.world/api/convert?url=${encodeURIComponent(url)}" target="_blank">Open Fast Downloader 2</a>
   <p style="margin-top:10px;font-size:13px;color:#666">Button pe click karke video download kar lo</p>`;
 }).catch(()=>{
   result.innerHTML=`<a href="https://snapinsta.app/download?url=${encodeURIComponent(url)}" target="_blank">Download Video</a>`;
 });
}
</script>
</body>
</html>
