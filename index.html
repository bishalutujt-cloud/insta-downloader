<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta Video Downloader - No Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.box{background:#fff;width:100%;max-width:420px;padding:25px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:center}
h2{margin-bottom:10px}
p.sub{color:#666;font-size:13px;margin-bottom:15px}
input{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;font-size:14px}
button{width:100%;margin-top:12px;padding:14px;background:#e1306c;color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
#result{margin-top:20px}
.success{color:green;font-weight:bold}
.btn{display:block;width:100%;padding:14px;margin-top:10px;border-radius:10px;text-decoration:none;color:#fff;font-weight:bold}
.btn1{background:#000}
.btn2{background:#444}
.error{color:red;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>📥 Insta Downloader</h2>
<p class="sub">Reels, Video, Story - No Login Required</p>
<input id="instaUrl" placeholder="Paste Instagram link here...">
<button onclick="downloadNow()">Download Now</button>
<div id="result"></div>
</div>

<script>
function downloadNow(){
  let url = document.getElementById('instaUrl').value.trim();
  let res = document.getElementById('result');
  if(!url){ res.innerHTML='<p class=error>❌ Pehle link paste karo</p>'; return; }
  
  // Convert to ddinstagram - works without any hosting/backend
  let ddLink = url.replace('https://www.instagram.com','https://ddinstagram.com').replace('https://instagram.com','https://ddinstagram.com').replace('http://www.instagram.com','https://ddinstagram.com').replace('www.instagram.com','ddinstagram.com').replace('instagram.com','ddinstagram.com');
  
  res.innerHTML = `
    <p class=success>✅ Ready Hai Bhai!</p>
    <a class="btn btn1" href="${ddLink}" target="_blank">⬇️ Server 1 - Direct Download</a>
    <a class="btn btn2" href="https://savegram.app/en#url=${encodeURIComponent(url)}" target="_blank">Server 2 - Backup</a>
    <p style="font-size:11px;color:#666;margin-top:10px">Server 1 khule to video par 3 dot ( ⋮ ) pe click karke Download karo</p>
  `;
}
</script>
</body>
</html>
