<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Insta Downloader</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(
    135deg,
    #833ab4,
    #fd1d1d,
    #fcb045
  );
}

.card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:22px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.logo{
  width:75px;
  height:75px;
  margin:auto;
  margin-bottom:15px;

  display:flex;
  justify-content:center;
  align-items:center;

  border-radius:20px;

  background:linear-gradient(
    135deg,
    #833ab4,
    #fd1d1d,
    #fcb045
  );

  font-size:36px;
}

h1{
  font-size:27px;
  margin-bottom:8px;
}

.subtitle{
  color:#777;
  font-size:14px;
  margin-bottom:22px;
}

input{
  width:100%;
  height:52px;

  padding:0 15px;

  border:2px solid #eee;
  border-radius:12px;

  outline:none;

  font-size:14px;

  margin-bottom:12px;
}

input:focus{
  border-color:#833ab4;
}

button{
  width:100%;
  height:52px;

  border:0;
  border-radius:12px;

  background:linear-gradient(
    135deg,
    #833ab4,
    #fd1d1d
  );

  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#message{
  margin-top:18px;
  font-size:14px;
}

.error{
  color:#d00000;
}

.success{
  color:#16834b;
  font-weight:bold;
}

.download{
  display:block;

  margin-top:12px;

  padding:14px;

  border-radius:12px;

  background:#16834b;

  color:white;

  text-decoration:none;

  font-weight:bold;
}

.info{
  margin-top:20px;
  padding-top:15px;

  border-top:1px solid #eee;

  color:#888;

  font-size:12px;
  line-height:1.5;
}

</style>
</head>

<body>

<div class="card">

  <div class="logo">📥</div>

  <h1>Insta Downloader</h1>

  <p class="subtitle">
    Download your authorized videos
  </p>

  <input
    id="url"
    type="url"
    placeholder="Paste direct video URL"
  >

  <button onclick="downloadVideo()">
    Download Video
  </button>

  <div id="message"></div>

  <div class="info">
    Only download videos that you own or have
    permission to download.
  </div>

</div>

<script>

function downloadVideo(){

  const url =
    document.getElementById("url").value.trim();

  const message =
    document.getElementById("message");

  if(!url){

    message.innerHTML =
      '<p class="error">⚠️ Please paste a video URL.</p>';

    return;
  }

  try{
    new URL(url);
  }
  catch{

    message.innerHTML =
      '<p class="error">❌ Invalid video URL.</p>';

    return;
  }

  message.innerHTML = `
    <p class="success">
      ✅ Video link ready
    </p>

    <a
      class="download"
      href="/download?url=${encodeURIComponent(url)}"
    >
      ⬇️ Download Video
    </a>
  `;
}

</script>

</body>
</html>
